name: Build Bruce S3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install platform
        run: pio pkg install -g -p "https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip"

      - name: Build
        run: pio run -e esp32-s3-devkitc-1-psram

      - name: Upload all bin files
        uses: actions/upload-artifact@v4
        with:
          name: bruce-bin
          path: .pio/build/esp32-s3-devkitc-1-psram/*.bin
          if-no-files-found: error
